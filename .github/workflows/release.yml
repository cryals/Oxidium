name: Release Oxidium

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows-x64:
    name: Release Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine & verify release version matches Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          $cargoToml = Get-Content -Path "Cargo.toml" -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not parse workspace version from Cargo.toml"
          }
          $wsVer = $Matches[1]
          if ($wsVer -ne $version) {
            throw "Release tag version ($version) does not match Cargo.toml workspace version ($wsVer)!"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run full workspace tests
        shell: pwsh
        run: |
          cargo build -p student-journal-mcp
          cargo test --workspace
      - name: Build release binaries
        shell: pwsh
        run: cargo build --release --workspace
      - name: Package Windows installer, portable ZIP & SBOM
        shell: pwsh
        run: pwsh -File scripts/package-windows.ps1 -Version "${{ steps.ver.outputs.version }}"
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/Oxidium-*-windows-x86_64-setup.exe
            dist/Oxidium-*-windows-x86_64-portable.zip
            dist/oxidium-*-sbom.cdx.json

  build-linux-x64:
    name: Release Build (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine & verify release version matches Cargo.toml
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          VER="${TAG#v}"
          WS_VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          if [ "$VER" != "$WS_VER" ]; then
            echo "ERROR: tag version ($VER) != Cargo.toml workspace version ($WS_VER)" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Install Linux GUI & TLS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev libssl-dev pkg-config dpkg-dev
      - name: Run full workspace tests
        run: |
          cargo build -p student-journal-mcp
          cargo test --workspace
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package Linux x86_64 (.tar.gz & .deb)
        run: bash scripts/package-linux.sh amd64 "${{ steps.ver.outputs.version }}"
      - name: Upload Linux x86_64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/Oxidium-*-linux-amd64.tar.gz
            dist/oxidium_*_amd64.deb

  build-linux-arm64:
    name: Release Build (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine & verify release version matches Cargo.toml
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          VER="${TAG#v}"
          WS_VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          if [ "$VER" != "$WS_VER" ]; then
            echo "ERROR: tag version ($VER) != Cargo.toml workspace version ($WS_VER)" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Install Linux GUI & TLS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev libssl-dev pkg-config dpkg-dev
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package Linux ARM64 (.tar.gz & .deb)
        run: bash scripts/package-linux.sh arm64 "${{ steps.ver.outputs.version }}"
      - name: Upload Linux ARM64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            dist/Oxidium-*-linux-arm64.tar.gz
            dist/oxidium_*_arm64.deb

  publish-release:
    name: Publish GitHub Release & Unified SHA256SUMS
    runs-on: ubuntu-24.04
    needs: [build-windows-x64, build-linux-x64, build-linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate unified SHA256SUMS.txt for in-app updater verification
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          LC_ALL=C sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Resolve tag & extract single-version release notes from CHANGELOG.md
        id: rel
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          REL_VER="${VER}" REL_TAG="${TAG}" python3 - <<'PY'
          import os, re
          from pathlib import Path
          ver = os.environ["REL_VER"]
          tag = os.environ["REL_TAG"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(ver)}\].*$", text, re.M)
          if m:
              rest = text[m.start():]
              nxt = re.search(r"\n## \[", rest[1:])
              section = rest[:nxt.start() + 1] if nxt else rest
              Path("release-notes.md").write_text(section.strip() + "\n", encoding="utf-8")
          else:
              Path("release-notes.md").write_text(f"# Oxidium {tag}\n", encoding="utf-8")
          PY
      - name: Publish or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "Oxidium ${{ steps.rel.outputs.tag }}"
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: release-assets/*
