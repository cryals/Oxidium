<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Oxidium — Personal Student Journal">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17151C"/>
      <stop offset="55%" stop-color="#1F1D26"/>
      <stop offset="100%" stop-color="#272332"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="82%" cy="18%" r="46%">
      <stop offset="0%" stop-color="#CAC3DC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#CAC3DC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="14%" cy="92%" r="36%">
      <stop offset="0%" stop-color="#DBC1C6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#DBC1C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trendArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CAC3DC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CAC3DC" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="898" height="218" rx="28"/>
    </clipPath>
  </defs>

  <!-- Outer M3 Expressive Card -->
  <rect x="1" y="1" width="898" height="218" rx="28" fill="url(#cardGrad)" stroke="#484550" stroke-width="1.5"/>

  <g clip-path="url(#bannerClip)">
