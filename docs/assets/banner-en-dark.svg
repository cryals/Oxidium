    <path d="M 27.6 9.8 L 33.0 7.2 L 33.0 27.6 L 27.6 30.0 Z" fill="#0B0B0E"/>
  </g>

  <!-- Center Brand & Metadata Block -->
  <rect x="180" y="38" width="286" height="24" rx="12" fill="#4A4459"/>
  <text x="323" y="53.8" text-anchor="middle" font-family="'Roboto Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#E7DFF8">MATERIAL 3 EXPRESSIVE · LOCAL-FIRST</text>

  <text x="178" y="114" font-family="'Roboto', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.8" fill="#E3E2E7">Oxidium</text>
  <text x="181" y="145" font-family="'Roboto', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="500" fill="#C9C5D1">Personal Student Journal</text>

  <!-- Subtle bottom tech strip -->
  <text x="181" y="177" font-family="'Roboto Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#CAC3DC">Rust 2024 · Slint UI · SQLite · 80 MCP Tools</text>

