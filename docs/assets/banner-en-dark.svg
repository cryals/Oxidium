  <text x="594" y="133" font-family="'Roboto', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#C9C5D1">Activity</text>
  <circle cx="716" cy="129.5" r="3" fill="#8CD99E"/>
  <circle cx="707" cy="129.5" r="3" fill="#FFCA62"/>
  <circle cx="698" cy="129.5" r="3" fill="#F2B8B5"/>
  <rect x="594" y="142" width="18" height="12" rx="3.5" fill="#353438" fill-opacity="0.75"/><rect x="615" y="142" width="18" height="12" rx="3.5" fill="#8CD99E" fill-opacity="0.86"/><rect x="636" y="142" width="18" height="12" rx="3.5" fill="#7AD7CA" fill-opacity="0.86"/><rect x="657" y="142" width="18" height="12" rx="3.5" fill="#8CD99E" fill-opacity="0.86"/><rect x="678" y="142" width="18" height="12" rx="3.5" fill="#FFCA62" fill-opacity="0.86"/><rect x="699" y="142" width="18" height="12" rx="3.5" fill="#F2B8B5" fill-opacity="0.86"/><rect x="594" y="157" width="18" height="12" rx="3.5" fill="#7AD7CA" fill-opacity="0.86"/><rect x="615" y="157" width="18" height="12" rx="3.5" fill="#8CD99E" fill-opacity="0.86"/><rect x="636" y="157" width="18" height="12" rx="3.5" fill="#D96B43" fill-opacity="0.86"/><rect x="657" y="157" width="18" height="12" rx="3.5" fill="#8CD99E" fill-opacity="0.86"/><rect x="678" y="157" width="18" height="12" rx="3.5" fill="#F2B8B5" fill-opacity="0.88"/><path d="M 678 160.5 A 3.5 3.5 0 0 1 681.5 157 H 687.0 V 169 H 681.5 A 3.5 3.5 0 0 1 678 165.5 Z" fill="#8CD99E" fill-opacity="0.92"/><rect x="699" y="157" width="18" height="12" rx="3.5" fill="#7AD7CA" fill-opacity="0.86"/><rect x="594" y="172" width="18" height="12" rx="3.5" fill="#F2B8B5" fill-opacity="0.86"/><rect x="615" y="172" width="18" height="12" rx="3.5" fill="#8CD99E" fill-opacity="0.86"/><rect x="636" y="172" width="18" height="12" rx="3.5" fill="#8CD99E" fill-opacity="0.86"/><rect x="657" y="172" width="18" height="12" rx="3.5" fill="#353438" fill-opacity="0.75"/><rect x="678" y="172" width="18" height="12" rx="3.5" fill="#7AD7CA" fill-opacity="0.86"/><rect x="699" y="172" width="18" height="12" rx="3.5" fill="#8CD99E" fill-opacity="0.86"/>

  <!-- Card 3: Donut + Live MCP Badge -->
  <rect x="740" y="116" width="128" height="80" rx="18" fill="#232129" stroke="#484550" stroke-width="1"/>
  <path d="M 774.92 139.20 A 21.00 21.00 0 0 1 789.41 171.74" fill="none" stroke="#8CD99E" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M 784.34 176.99 A 21.00 21.00 0 0 1 757.41 175.11" fill="none" stroke="#7AD7CA" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M 753.13 169.21 A 21.00 21.00 0 0 1 754.19 148.87" fill="none" stroke="#FFCA62" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M 759.07 143.45 A 21.00 21.00 0 0 1 767.63 139.46" fill="none" stroke="#D96B43" stroke-width="4.6" stroke-linecap="round"/>
  <text x="772" y="161" text-anchor="middle" font-family="'Roboto Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#E3E2E7">4.7</text>
  <text x="772" y="170" text-anchor="middle" font-family="'Roboto', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="6.4" fill="#C9C5D1">avg</text>

  <!-- Right mini status chips inside Card 3 -->
  <rect x="803" y="133" width="53" height="20" rx="10" fill="#184E27"/>
  <circle cx="813" cy="143" r="3" fill="#8CD99E"/>
  <text x="821" y="146.5" font-family="'Roboto Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#8CD99E">MCP</text>

  <rect x="803" y="160" width="53" height="19" rx="9.5" fill="#4A4459"/>
  <text x="829.5" y="173" text-anchor="middle" font-family="'Roboto Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600" fill="#E7DFF8">WAL</text>
