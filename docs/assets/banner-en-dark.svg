    <rect x="0" y="0" width="900" height="220" fill="url(#glowBottomLeft)"/>
    <!-- Subtle decorative concentric M3 rings on right -->
    <circle cx="848" cy="36" r="140" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="848" cy="36" r="205" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </g>

  <!-- Left App Emblem (faithful vector version of Oxidium icon-192.png) -->
  <rect x="42" y="54" width="112" height="112" rx="30" fill="#4A4459" stroke="rgba(202,195,220,0.28)" stroke-width="1.5"/>
  <circle cx="98" cy="110" r="39" fill="#FFFFFF" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <g transform="translate(98, 110) scale(1.26) translate(-24, -23.5)">
