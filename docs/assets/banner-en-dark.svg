  <line x1="596" y1="68" x2="854" y2="68" stroke="#7AD7CA" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- Area fill & Smooth spline -->
  <path d="M 596 91 C 624 91, 634 76, 662 78 C 690 80, 704 88, 732 74 C 760 61, 782 68, 808 60 C 826 55, 840 58, 852 56 L 852 98 L 596 98 Z" fill="url(#trendArea)"/>
