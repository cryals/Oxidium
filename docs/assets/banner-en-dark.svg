  <circle cx="662" cy="78" r="2.6" fill="#CAC3DC"/>
  <circle cx="732" cy="74" r="2.6" fill="#CAC3DC"/>
  <circle cx="808" cy="60" r="2.6" fill="#CAC3DC"/>
  <circle cx="852" cy="56" r="6" fill="#8CD99E" fill-opacity="0.24"/>
  <circle cx="852" cy="56" r="3.4" fill="#8CD99E"/>

