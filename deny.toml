[graph]
all-features = false

[advisories]
# Security vulnerabilities are strictly denied.
# Only non-security `unmaintained` notices from upstream dependencies are explicitly documented here.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice (not a vulnerability); pulled transitively by i-slint-core, rmcp, rusqlite, and schemars" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-only",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
