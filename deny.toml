[graph]
all-features = false

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "LGPL-3.0-only",
    "OpenSSL",
]
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "slint" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-core" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-compiler" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-common" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-backend-selector" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-backend-winit" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-backend-testing" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-renderer-femtovg" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-renderer-software" },
    { allow = ["GPL-3.0-only"], crate = "slint-build" },
    { allow = ["GPL-3.0-only"], crate = "slint-macros" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
